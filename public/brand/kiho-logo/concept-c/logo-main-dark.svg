<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  
  <g transform="translate(60, 52)">
    <!-- Letter k -->
    <rect x="0" y="-18" width="15" height="94" rx="3.2" fill="#FFFFFF"/>
    <polygon points="15,38 48,-4 66,-4 31,41 71,76 51,76 15,46" fill="#FFFFFF"/>

    <!-- Letter i with 4-Point Star Camera Spark as Dot -->
    <g transform="translate(82, 0)">
      <!-- Camera Sparkle Dot (✦) -->
      <path d="M 8 -16 C 8 -9 3 -4 -4 -4 C 3 -4 8 1 8 8 C 8 1 13 -4 20 -4 C 13 -4 8 -9 8 -16 Z" fill="#FFFFFF"/>
      <rect x="0" y="8" width="16" height="68" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- Letter h -->
    <g transform="translate(118, 0)">
      <rect x="0" y="-18" width="15" height="94" rx="3.2" fill="#FFFFFF"/>
      <path d="M 15 26 C 24 10 38 6 50 6 C 65 6 73 16 73 31 L 73 76 L 58 76 L 58 35 C 58 25 52 19 44 19 C 33 19 15 26 15 40 L 15 76 L 0 76" fill="#FFFFFF"/>
    </g>

    <!-- Letter o as Embedded Camera Focus Ring -->
    <g transform="translate(208, 0)">
      <circle cx="39" cy="42" r="35" fill="#FFFFFF"/>
      <circle cx="39" cy="42" r="23" fill="#FAF8F5"/>
      <!-- Concentric Focus Ring -->
      <circle cx="39" cy="42" r="15" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Center Optic -->
      <circle cx="39" cy="42" r="6.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Subtitle: camera · studio -->
  <text x="210" y="166" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">CAMERA · STUDIO</text>
</svg>