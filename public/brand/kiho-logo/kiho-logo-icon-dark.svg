<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <g id="kiho-kh-icon">
  <defs>
    <mask id="i-dark">
      <rect width="120" height="120" fill="white"/>
      <!-- Physical circular cutout for optical lens cavity: r=13.5 at (59, 60) -->
      <circle cx="59" cy="60" r="13.5" fill="black"/>
    </mask>
  </defs>

  <g mask="url(#i-dark)">
    <!-- K Left Stem -->
    <rect x="18" y="26" width="10.5" height="68" rx="3.2" fill="#FFFFFF"/>

    <!-- K Diagonals -->
    <path d="M 27 60 L 53 30 C 54.5 28.5 57.5 29 58.5 31 L 61.5 36 C 62.5 38 62 40.5 60 42 L 37 66 Z" fill="#FFFFFF"/>
    <path d="M 37 54 L 60 78 C 62 79.5 62.5 82 61.5 84 L 58.5 89 C 57.5 91 54.5 91.5 53 90 L 27 60 Z" fill="#FFFFFF"/>

    <!-- H Left Stem -->
    <rect x="65" y="26" width="10.5" height="68" rx="3.2" fill="#FFFFFF"/>

    <!-- H Right Stem -->
    <rect x="94" y="26" width="10.5" height="68" rx="3.2" fill="#FFFFFF"/>

    <!-- H Crossbar -->
    <rect x="73" y="55" width="23" height="10" fill="#FFFFFF"/>

    <!-- Central Bridge connecting K to H -->
    <rect x="47" y="55" width="22" height="10" fill="#FFFFFF"/>
  </g>

  <!-- Optical Camera Lens Assembly (Concentric rings, open optical center) -->
  <circle cx="59" cy="60" r="13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="59" cy="60" r="7.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
</g>
</svg>