<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <g id="kiho-kh-icon">
    
  <defs>
    <mask id="icon-dark">
      <rect width="120" height="120" fill="white"/>
      <!-- Circular negative space lens aperture: radius 12.5 at center junction (56, 60) -->
      <circle cx="56" cy="60" r="12.5" fill="black"/>
    </mask>
  </defs>

  <g mask="url(#icon-dark)">
    <!-- Left Pillar (Stem of K and Left of H): width 12, height 76, rx 3.5 -->
    <rect x="22" y="22" width="12" height="76" rx="3.5" fill="#FFFFFF"/>
    
    <!-- Right Pillar (Right stem of H): width 12, height 76, rx 3.5 -->
    <rect x="86" y="22" width="12" height="76" rx="3.5" fill="#FFFFFF"/>
    
    <!-- Horizontal Crossbar of H -->
    <rect x="26" y="54.5" width="68" height="11" fill="#FFFFFF"/>
    
    <!-- K Upper Diagonal Arm -->
    <path d="M 30 54 L 75 22.5 C 77 21 80 22 81 24.5 L 83 28 C 84 30.5 83 33 81 34.5 L 48 60 Z" fill="#FFFFFF"/>
    
    <!-- K Lower Diagonal Leg -->
    <path d="M 48 60 L 81 85.5 C 83 87 84 89.5 83 92 L 81 95.5 C 80 98 77 99 75 97.5 L 30 66 Z" fill="#FFFFFF"/>
  </g>

  <!-- Subtle concentric optical lens ring in negative space -->
  <circle cx="56" cy="60" r="7" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>

  </g>
</svg>