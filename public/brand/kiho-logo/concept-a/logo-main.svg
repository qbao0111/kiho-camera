<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  
  <!-- KIHO Wordmark -->
  <g transform="translate(60, 40)">
    <!-- Letter K -->
    <path d="M 0 0 L 16 0 L 16 42 L 50 0 L 71 0 L 31 49 L 75 102 L 53 102 L 16 57 L 16 102 L 0 102 Z" fill="#111111"/>

    <!-- Letter I -->
    <rect x="94" y="0" width="16" height="102" rx="2" fill="#111111"/>

    <!-- Letter H -->
    <g transform="translate(132, 0)">
      <rect x="0" y="0" width="16" height="102" rx="2" fill="#111111"/>
      <rect x="16" y="44" width="38" height="14" fill="#111111"/>
      <rect x="54" y="0" width="16" height="102" rx="2" fill="#111111"/>
    </g>

    <!-- Letter O as Precision Optical Camera Lens -->
    <g transform="translate(224, 0)">
      <!-- Outer Lens Barrel -->
      <circle cx="51" cy="51" r="51" fill="#111111"/>
      <!-- Aperture Cavity -->
      <circle cx="51" cy="51" r="35" fill="#FAF8F5"/>
      <!-- Inner Optical Glass Ring -->
      <circle cx="51" cy="51" r="22" fill="#111111"/>
      <!-- Clear Optical Pupil -->
      <circle cx="51" cy="51" r="11" fill="#FAF8F5"/>
      <!-- Optical Glint -->
      <circle cx="46" cy="46" r="4" fill="#111111"/>
    </g>

    <!-- Minimal 4-Ray Lens Flare Sparkle on top-right of O -->
    <path d="M 326 -4 C 326 5 320 12 310 12 C 320 12 326 19 326 28 C 326 19 332 12 342 12 C 332 12 326 5 326 -4 Z" fill="#111111"/>
  </g>

  <!-- Subtitle: C A M E R A -->
  <text x="280" y="174" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700" fill="#111111" letter-spacing="12" text-anchor="middle">CAMERA</text>
</svg>