<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="cutout-y2k">
        <rect width="1080" height="1920" fill="white"/>
        <rect x="70" y="360" width="940" height="1150" rx="24" ry="24" fill="black"/>
      </mask>
      <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F111A"/>
        <stop offset="50%" stop-color="#151824"/>
        <stop offset="100%" stop-color="#0B0C12"/>
      </linearGradient>
      <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="25%" stop-color="#C5CCD9"/>
        <stop offset="50%" stop-color="#FFFFFF"/>
        <stop offset="75%" stop-color="#8E9AA8"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <linearGradient id="hologram-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#F472B6"/>
      </linearGradient>
    </defs>

    <!-- Dark Titanium Cyber Canvas with Cutout -->
    <rect width="1080" height="1920" fill="url(#cyber-bg)" mask="url(#cutout-y2k)"/>

    <!-- Subtle Y2K Grid -->
    <g stroke="#38BDF8" stroke-width="1" stroke-opacity="0.08" mask="url(#cutout-y2k)">
      <line x1="0" y1="120" x2="1080" y2="120"/>
      <line x1="0" y1="240" x2="1080" y2="240"/>
      <line x1="0" y1="1800" x2="1080" y2="1800"/>
      <line x1="160" y1="0" x2="160" y2="1920"/>
      <line x1="920" y1="0" x2="920" y2="1920"/>
    </g>

    <!-- Outer Chrome Metallic Border -->
    <rect x="30" y="30" width="1020" height="1860" rx="28" ry="28" fill="none" stroke="url(#chrome-grad)" stroke-width="2.5" stroke-opacity="0.75" mask="url(#cutout-y2k)"/>

    <!-- Decorative Chrome Starbursts (✦ ✧) -->
    <g fill="url(#chrome-grad)" mask="url(#cutout-y2k)">
      <!-- Top Left Star -->
      <path d="M 65 75 Q 85 75 85 55 Q 85 75 105 75 Q 85 75 85 95 Q 85 75 65 75 Z"/>
      <!-- Top Right Star -->
      <path d="M 985 85 Q 1005 85 1005 65 Q 1005 85 1025 85 Q 1005 85 1005 105 Q 1005 85 985 85 Z"/>
      <!-- Bottom Left Star -->
      <path d="M 65 1835 Q 85 1835 85 1815 Q 85 1835 105 1835 Q 85 1835 85 1855 Q 85 1835 65 1835 Z"/>
    </g>

    <!-- ================= HEADER SECTION ================= -->
    <g transform="translate(0, 40)">
      <!-- Digicam OSD / HUD Status Bar -->
      <g transform="translate(540, 30)">
        <rect x="-420" y="0" width="840" height="34" rx="8" fill="#1E2333" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
        <!-- Flashing Red REC Dot -->
        <circle cx="-385" cy="17" r="6" fill="#EF4444"/>
        <text x="-365" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#EF4444">REC [SP]</text>
        <text x="-260" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">00:24:18</text>

        <!-- Battery Indicator -->
        <g transform="translate(180, 10)">
          <rect x="0" y="0" width="36" height="14" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
          <rect x="36" y="3" width="3" height="8" rx="1" fill="#38BDF8"/>
          <rect x="3" y="3" width="22" height="8" fill="#38BDF8"/>
          <text x="50" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">95%</text>
        </g>
        <text x="320" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B">⚡ FLASH: ON</text>
      </g>

      <!-- Main Display Title -->
      <g transform="translate(540, 125)">
        <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="70" font-weight="900" fill="url(#chrome-grad)" letter-spacing="4">
          FLASH MEMORY
        </text>
      </g>

      <!-- Subtitle -->
      <g transform="translate(540, 180)">
        <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="4">
          ★ KIHO DIGICAM PHOTOBOOTH • CYBER RETRO 2000s ★
        </text>
      </g>
    </g>

    <!-- ================= PHOTO WINDOW FRAMING ================= -->
    <!-- Metallic Viewfinder Border -->
    <rect x="70" y="360" width="940" height="1150" rx="24" ry="24" fill="none" stroke="url(#chrome-grad)" stroke-width="4"/>
    <rect x="76" y="366" width="928" height="1138" rx="18" ry="18" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Autofocus Target Brackets in Viewfinder -->
    <!-- Top-Left Bracket -->
    <path d="M 105 435 L 105 395 L 145 395" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Top-Right Bracket -->
    <path d="M 975 435 L 975 395 L 935 395" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Bottom-Left Bracket -->
    <path d="M 105 1435 L 105 1475 L 145 1475" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Bottom-Right Bracket -->
    <path d="M 975 1435 L 975 1475 L 935 1475" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Central Focus Crosshair -->
    <g transform="translate(540, 935)" stroke="#38BDF8" stroke-width="2">
      <line x1="-20" y1="0" x2="-8" y2="0"/>
      <line x1="8" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="-20" x2="0" y2="-8"/>
      <line x1="0" y1="8" x2="0" y2="20"/>
      <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
    </g>

    <!-- Digicam Bottom OSD Overlay on Photo Edge -->
    <g transform="translate(105, 1475)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.9" letter-spacing="2">
        ISO 400 • F/2.8 • 1/125s • AWB • [AF-C]
      </text>
    </g>

    <!-- ================= FOOTER SECTION ================= -->
    <g transform="translate(0, 1545)">
      <!-- Iconic Vintage 7-Segment Digital Orange Date Stamp + Hologram Badges -->
      <g transform="translate(540, 0)">
        <!-- Digital Orange Date Stamp -->
        <g transform="translate(-250, 0)">
          <rect x="-140" y="0" width="280" height="56" rx="10" fill="#000000" stroke="#FF6B00" stroke-width="2"/>
          <text x="0" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#FF6B00" letter-spacing="4">
            ’26 08 29
          </text>
        </g>

        <!-- Holographic Pop Sticker: PURE MEMORY -->
        <g transform="translate(80, 0)">
          <rect x="-90" y="0" width="180" height="56" rx="10" fill="url(#hologram-grad)"/>
          <text x="0" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#000000" letter-spacing="1">
            ★ PURE MEMORY ★
          </text>
        </g>

        <!-- Holographic Pop Sticker: SMILE! -->
        <g transform="translate(290, 0)">
          <rect x="-90" y="0" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
          <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#0E1017" letter-spacing="1">
            SMILE &amp; FLASH 📸
          </text>
        </g>
      </g>

      <!-- Brand Footer Row -->
      <g transform="translate(0, 95)">
        <g transform="translate(70, 0)">
          
    <svg viewBox="0 0 355 175" width="195.25000000000003" height="96.25000000000001">
      <g transform="translate(-10, 0)">
        <rect x="28" y="20" width="22" height="100" rx="4" fill="#FFFFFF"/>
        <path d="M 48 72 L 87 21 C 89 18.5 92 18.5 94.5 20.5 L 104 27.5 C 106.5 29.5 106.5 32.5 104.5 35 L 68 76 Z" fill="#FFFFFF"/>
        <path d="M 58 68 L 97 113.5 C 99 116 102 116.5 104.5 114.5 L 112 108 C 114.5 106 114.5 103 112.5 100.5 L 75 58 Z" fill="#FFFFFF"/>
        <circle cx="131" cy="30" r="11" fill="#FFFFFF"/>
        <rect x="120" y="50" width="22" height="70" rx="4" fill="#FFFFFF"/>
        <rect x="156" y="20" width="22" height="100" rx="4" fill="#FFFFFF"/>
        <path d="M 178 72 C 188 56 203 50 217 50 C 232 50 239 60 239 76 L 239 120 L 217 120 L 217 78 C 217 70 212 67 204 67 C 194 67 178 74 178 88 L 178 120 L 156 120" fill="#FFFFFF"/>
        <circle cx="290" cy="85" r="37" fill="#FFFFFF"/>
        <circle cx="290" cy="85" r="21.5" fill="#0E1017"/>
        <circle cx="290" cy="85" r="14" fill="#FFFFFF"/>
        <circle cx="285" cy="80" r="4.5" fill="#0E1017"/>
        <text x="178" y="156" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">CAMERA</text>
      </g>
    </svg>