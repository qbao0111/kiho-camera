<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="cutout-sunset">
        <rect width="1080" height="1350" fill="white"/>
        <rect x="70" y="230" width="940" height="810" rx="20" ry="20" fill="black"/>
      </mask>
      <linearGradient id="sunset-bg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FDF8F4"/>
        <stop offset="60%" stop-color="#FCF3EC"/>
        <stop offset="100%" stop-color="#F7E6D7"/>
      </linearGradient>
      <linearGradient id="gold-sunset" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#D95D39"/>
        <stop offset="50%" stop-color="#F29C38"/>
        <stop offset="100%" stop-color="#D95D39"/>
      </linearGradient>
    </defs>

    <!-- Canvas Background with Cutout -->
    <rect width="1080" height="1350" fill="url(#sunset-bg)" mask="url(#cutout-sunset)"/>

    <!-- Subtle Wave & Breeze Line Accents -->
    <g mask="url(#cutout-sunset)" opacity="0.35">
      <path d="M 0 100 Q 270 70 540 100 T 1080 100" fill="none" stroke="#D95D39" stroke-width="1.5"/>
      <path d="M 0 115 Q 270 85 540 115 T 1080 115" fill="none" stroke="#F29C38" stroke-width="1"/>
      <path d="M 0 1250 Q 270 1220 540 1250 T 1080 1250" fill="none" stroke="#3D7068" stroke-width="1.5"/>
    </g>

    <!-- Thin Double Border Frame -->
    <rect x="30" y="30" width="1020" height="1290" rx="28" ry="28" fill="none" stroke="#D95D39" stroke-width="2" stroke-opacity="0.7" mask="url(#cutout-sunset)"/>
    <rect x="38" y="38" width="1004" height="1274" rx="22" ry="22" fill="none" stroke="#F29C38" stroke-width="1" stroke-opacity="0.4" mask="url(#cutout-sunset)"/>

    <!-- ================= HEADER SECTION ================= -->
    <g transform="translate(0, 25)">
      <!-- Tag Pill -->
      <g transform="translate(540, 30)">
        <rect x="-180" y="0" width="360" height="32" rx="16" fill="#D95D39" fill-opacity="0.12"/>
        <rect x="-180" y="0" width="360" height="32" rx="16" fill="none" stroke="#D95D39" stroke-width="1.2"/>
        <text x="0" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#D95D39" letter-spacing="3.5">NHẬT LỆ • BẢO NINH • GOLDEN HOUR</text>
      </g>

      <!-- Main Display Title -->
      <g transform="translate(540, 125)">
        <text x="0" y="0" text-anchor="middle" font-family="'Playfair Display', serif" font-size="58" font-weight="900" fill="#1C1917" letter-spacing="4">ĐỒNG HỚI</text>
        <text x="0" y="38" text-anchor="middle" font-family="'Playfair Display', serif" font-style="italic" font-size="28" font-weight="600" fill="#D95D39">Sunset &amp; Sea Breeze</text>
      </g>

      <!-- Poetic Subline -->
      <g transform="translate(540, 185)">
        <text x="0" y="0" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#6E5A4E" letter-spacing="3">HOÀNG HÔN NHUỘM VÀNG SÓNG BIỂN MIỀN TRUNG</text>
      </g>

      <!-- Sunburst & Breeze Emblem (Top Right) -->
      <g transform="translate(930, 85)">
        <circle cx="0" cy="0" r="44" fill="none" stroke="#D95D39" stroke-width="1.5"/>
        <!-- Sun Rays -->
        <g stroke="#D95D39" stroke-width="1.5">
          <line x1="0" y1="-52" x2="0" y2="-44"/>
          <line x1="0" y1="44" x2="0" y2="52"/>
          <line x1="-52" y1="0" x2="-44" y2="0"/>
          <line x1="44" y1="0" x2="52" y2="0"/>
          <line x1="-36" y1="-36" x2="-30" y2="-30"/>
          <line x1="30" y1="30" x2="36" y2="36"/>
          <line x1="-36" y1="36" x2="-30" y2="30"/>
          <line x1="30" y1="-30" x2="36" y2="-36"/>
        </g>
        <text x="0" y="-4" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#D95D39">17:45</text>
        <text x="0" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#6E5A4E">SUNSET</text>
      </g>

      <!-- Minimal Wave Mark (Top Left) -->
      <g transform="translate(70, 70)">
        <path d="M 0 0 C 15 -10 25 10 40 0 C 55 -10 65 10 80 0" fill="none" stroke="#3D7068" stroke-width="2" stroke-linecap="round"/>
        <path d="M 0 12 C 15 2 25 22 40 12 C 55 2 65 22 80 12" fill="none" stroke="#3D7068" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- ================= PHOTO WINDOW FRAMING ================= -->
    <rect x="70" y="230" width="940" height="810" rx="20" ry="20" fill="none" stroke="#D95D39" stroke-width="3"/>
    <rect x="78" y="238" width="924" height="794" rx="14" ry="14" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Subtle Registration Crosshairs at Corners -->
    <!-- Top-Left -->
    <g transform="translate(100, 260)" stroke="#D95D39" stroke-width="1.8">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <circle cx="0" cy="0" r="4" fill="none"/>
    </g>
    <!-- Top-Right -->
    <g transform="translate(980, 260)" stroke="#D95D39" stroke-width="1.8">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <circle cx="0" cy="0" r="4" fill="none"/>
    </g>
    <!-- Bottom-Left -->
    <g transform="translate(100, 1010)" stroke="#D95D39" stroke-width="1.8">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <circle cx="0" cy="0" r="4" fill="none"/>
    </g>
    <!-- Bottom-Right -->
    <g transform="translate(980, 1010)" stroke="#D95D39" stroke-width="1.8">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <circle cx="0" cy="0" r="4" fill="none"/>
    </g>

    <!-- ================= FOOTER SECTION ================= -->
    <g transform="translate(0, 1062)">
      <!-- Poetic Caption Banner -->
      <g transform="translate(540, 0)">
        <text x="0" y="0" text-anchor="middle" font-family="'Playfair Display', serif" font-style="italic" font-size="16" font-weight="600" fill="#1C1917">
          “Gió biển mát rượi, sóng vỗ bờ cát trắng — Giữ lại những ngày thanh xuân rực rỡ.”
        </text>
      </g>

      <!-- Contact Sheet Film Metadata Strip -->
      <g transform="translate(540, 38)">
        <rect x="-420" y="0" width="840" height="34" rx="8" fill="#FFFFFF" stroke="#D95D39" stroke-width="1" stroke-opacity="0.5"/>
        <text x="0" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#D95D39" letter-spacing="3">
          ROLL #04 // CANON R50 • 35MM F/1.8 • GOLDEN HOUR • ĐỒNG HỚI COAST
        </text>
      </g>

      <!-- Brand Footer Row -->
      <g transform="translate(0, 85)">
        <g transform="translate(75, 0)">
          
    <svg viewBox="0 0 355 175" width="195.25000000000003" height="96.25000000000001">
      <g transform="translate(-10, 0)">
        <rect x="28" y="20" width="22" height="100" rx="4" fill="#D95D39"/>
        <path d="M 48 72 L 87 21 C 89 18.5 92 18.5 94.5 20.5 L 104 27.5 C 106.5 29.5 106.5 32.5 104.5 35 L 68 76 Z" fill="#D95D39"/>
        <path d="M 58 68 L 97 113.5 C 99 116 102 116.5 104.5 114.5 L 112 108 C 114.5 106 114.5 103 112.5 100.5 L 75 58 Z" fill="#D95D39"/>
        <circle cx="131" cy="30" r="11" fill="#D95D39"/>
        <rect x="120" y="50" width="22" height="70" rx="4" fill="#D95D39"/>
        <rect x="156" y="20" width="22" height="100" rx="4" fill="#D95D39"/>
        <path d="M 178 72 C 188 56 203 50 217 50 C 232 50 239 60 239 76 L 239 120 L 217 120 L 217 78 C 217 70 212 67 204 67 C 194 67 178 74 178 88 L 178 120 L 156 120" fill="#D95D39"/>
        <circle cx="290" cy="85" r="37" fill="#D95D39"/>
        <circle cx="290" cy="85" r="21.5" fill="#FDF7F2"/>
        <circle cx="290" cy="85" r="14" fill="#D95D39"/>
        <circle cx="285" cy="80" r="4.5" fill="#FDF7F2"/>
        <text x="178" y="156" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700" fill="#D95D39" letter-spacing="8" text-anchor="middle">CAMERA</text>
      </g>
    </svg>